name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Run tests against the editable working tree
        run: uv run --with '.[test]' pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build
      - name: Verify the built wheel imports
        run: |
          uv venv --python 3.12 /tmp/whlcheck
          uv pip install --python /tmp/whlcheck/bin/python dist/*.whl
          cd /tmp
          /tmp/whlcheck/bin/python -I -c "
          import incomprehensible as inc
          assert sorted(inc.__all__) == ['dedupe_dictlist', 'dict_pivot', 'flatten_list', 'get_files', 'split_strip_coerce']
          for name in inc.__all__:
              assert callable(getattr(inc, name))
          assert inc.flatten_list([1, [2, 3]]) == [1, 2, 3]
          "
      - name: List built artifacts
        run: ls -l dist
